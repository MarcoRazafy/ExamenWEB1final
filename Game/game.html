<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <title>Finger Fury</title>
</head>

<body>
    <header>
        <div class="return"><i class="fa-solid fa-arrow-left"></i></div>
        
        <div class="title">
            <h1 class=".animated-title" id="animatedTitle"></h1>
        </div>

        
        <main>
            <div class="combin">
                <label for="mode">Select Mode :</label>
                <select id="mode">
                    <option value="easy">Easy</option>
                    <option value="medium">Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
            <div class="center-main">
                <p id="word-display"></p>
                <!-- <label for="input-field">Tapez un mot :</label> -->
                <input type="text" id="input-field" placeholder="Tapez ici" autofocus>
            </div>
            <div class="box-results">
                <span>SCORE : </span>
                <p id="results"></p>
            </div>
        </main>
    </header>
    <div class="score">
        <div class="box-score">
            <p class="text-score" style="color: white;">
                SCORE : 
            </p>
            <div class="boxButton">
                <button id="home"><i class="fa-solid fa-house"></i></button>
                <button id="retry"><i class="fa-solid fa-rotate-right"></i></button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
