<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finger Fury</title>
    <link rel="stylesheet" href="accueil.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <section class="presentation_top">
        <h1>Finger <span>Fury</span></h1>
        <div>
            <p>READY - SET - TYPE!</p><br>
            <p>Challenge your speed and precision against the timer.</p>
        </div>
    </section>

    <section class="presentation_middle">
        <button class="presentation_middle_start">
            <i></i>
            <h3>START</h3>
        </button>

        <button class="presentation_middle_level"><h3>LEVEL</h3></button>
    </section>

    <section class="presentation_bottom">
        <button class="presentation_bottom_settings" onclick="ouvrir_option()">
            <i class="fa-solid fa-gear"></i>
            <p>Settings</p>
        </button>

        <div id="settings_list">
            <div class="settings_list_content">
                <button>Langage : </button>
                <div class="langage_lists">
                    <ul>
                        <li>Malagasy</li>
                        <li>French</li>
                        <li>English</li>
                    </ul>
                </div>
    
            <button>Difficulty : </button>
                <div class="difficulty_lists">
                    <ul>
                        <li>Easy</li>
                        <li>Medium</li>
                        <li>Hard</li>
                    </ul>
                </div>
    
            <button>Mode : </button>
                <div class="mode_lits">
                    <ul>
                        <li>Light</li>
                        <li>Dark</li>
                    </ul>
                </div>

            <button class="fermer_btn" onclick="fermer_option()">Fermer</button>
            </div>
        </div>

        <button class="presentation_bottom_about">
            <i class="fa-solid fa-info"></i>
            <p>About</p>
        </button>
    </section>
</body>

<script src="accueil.js"></script>
</html>
