<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finger Fury</title>
    <link rel="stylesheet" href="setting.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <h2>Settings : </h2>

    <div id="settings_list">
        <button>Langage : </button>
            <div class="langage_lists">
                <ul>
                    <li>Malagasy</li>
                    <li>French</li>
                    <li>English</li>
                </ul>
            </div>

        <button>Difficulty : </button>
            <div class="difficulty_lists">
                <ul>
                    <li>Easy</li>
                    <li>Medium</li>
                    <li>Hard</li>
                </ul>
            </div>

        <button>Mode : </button>
            <div class="mode_lits">
                <ul>
                    <li>Light</li>
                    <li>Dark</li>
                </ul>
            </div>
    </div>
</body>
</html>
