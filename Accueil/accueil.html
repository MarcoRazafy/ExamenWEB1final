<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Finger Fury</title>
    <link rel="stylesheet" href="accueil.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>

<body>
    <section class="presentation_top">
        <h1>Finger <span>Fury</span></h1>
        <p>Ready, set, type! Challenge your speed and precision against the timer.</p>
    </section>

    <section class="presentation_middle">
        <div class="presentation_middle_start">
            <button><h3>START</h3></button>
        </div>

        <div class="presentation_middle_level">
            <button><h3>LEVEL</h3></button>
        </div>
    </section>

    <section class="presentation_bottom">
        <div>
            <button>
                <i class="fa-solid fa-gear"></i>
                <p>Settings</p>
            </button>

            <div>
                <ul>
                    <li>Langue : </li>
                    <li>Difficulté : </li>
                    <li>Thème de jeu : </li>
                </ul>
            </div>
        </div>

        <div>
            <i class="fa-solid fa-info"></i>
            <p>About Finger Fury</p>
        </div>
    </section>
</body>

<script src="accueil.js"></script>
</html>
